plugins {
    alias libs.plugins.spring.boot apply false
    alias libs.plugins.spotless
    alias libs.plugins.cyclonedx apply false
    alias libs.plugins.dependency.check apply false
    id 'io.spring.dependency-management' version '1.1.7' apply false
    id 'java'
}

allprojects {
    group = 'com.openhire'
    version = '0.1.0-SNAPSHOT'

    repositories {
        mavenCentral()
    }
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'com.diffplug.spotless'
    // Applied per project: root-level tasks either skip subprojects or resolve their configurations, which Gradle 9 rejects.
    apply plugin: 'org.cyclonedx.bom'
    apply plugin: 'org.owasp.dependencycheck'

    dependencyLocking {
        lockAllConfigurations()
    }

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(25)
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.compilerArgs += '-parameters'
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
    }

    spotless {
        java {
            palantirJavaFormat('2.73.0')
            removeUnusedImports()
            trimTrailingWhitespace()
            endWithNewline()
        }
    }

    dependencies {
        // Generate live specifications in runnable services; only the reactive gateway hosts Swagger UI.
        if (project.name == 'api-gateway') {
            implementation rootProject.libs.springdoc.webflux.ui
        } else if (!(project.name in ['platform-starter', 'service-support'])) {
            implementation rootProject.libs.springdoc.webmvc.api
        }
        testImplementation libs.archunit.junit5
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }

    cyclonedxBom {
        includeConfigs = ['runtimeClasspath']
        outputName = "${project.name}-sbom"
        outputFormat = 'json'
    }

    tasks.named('cyclonedxBom').configure {
        notCompatibleWithConfigurationCache('CycloneDX resolves project runtime configurations at execution time')
    }

    dependencyCheck {
        failBuildOnCVSS = 8.0
        formats = ['HTML', 'JSON']
        scanConfigurations = ['runtimeClasspath']
        nvd {
            apiKey = System.getenv('NVD_API_KEY')
        }
    }
}
