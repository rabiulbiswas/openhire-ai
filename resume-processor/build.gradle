plugins {
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
}

dependencies {
    // Keep the supported 3.x API; load only the resume formats we accept.
    implementation 'org.apache.tika:tika-core:3.3.3'
    implementation 'org.apache.tika:tika-parser-pdf-module:3.3.3'
    implementation 'org.apache.tika:tika-parser-microsoft-module:3.3.3'
    implementation 'org.apache.tika:tika-parser-ocr-module:3.3.3'
    implementation project(':service-support')
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-data-mongodb'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    implementation 'org.springframework.boot:spring-boot-starter-kafka'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
}

bootJar {
    archiveFileName = 'resume-processor.jar'
}
