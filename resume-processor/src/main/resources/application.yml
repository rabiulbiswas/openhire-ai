server:
  port: ${SERVICE_PORT:8086}
  shutdown: graceful
spring:
  application:
    name: resume-processor
  mongodb:
    representation:
      uuid: standard
    uri: ${MONGODB_URI:mongodb://localhost:27017/oh_resume}
  data:
    mongodb:
      auto-index-creation: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        delivery.timeout.ms: 10000
        request.timeout.ms: 5000
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8180/realms/openhire-staff}
          jwk-set-uri: ${OIDC_JWK_SET_URI:http://localhost:8180/realms/openhire-staff/protocol/openid-connect/certs}
openhire:
  security:
    mode: ${SECURITY_MODE:oidc}
  tenant:
    default-id: ${DEFAULT_TENANT_ID:}
  internal-secret: ${INTERNAL_SERVICE_SECRET:local-development-secret}
  application-url: ${APPLICATION_SERVICE_URL:http://application-service:8084}
  outbox:
    relay-enabled: true
    collection: resumes
    topic: resume.events.v1
  resume:
    scan-enabled: ${RESUME_SCAN_ENABLED:true}
    directory: ${RESUME_DIRECTORY:./.openhire-resumes}
    extraction:
      concurrency: ${RESUME_EXTRACTION_CONCURRENCY:1}
      timeout-seconds: ${RESUME_EXTRACTION_TIMEOUT_SECONDS:80}
      max-pages: ${RESUME_EXTRACTION_MAX_PAGES:20}
      max-characters: ${RESUME_EXTRACTION_MAX_CHARACTERS:1000000}
      ocr-timeout-seconds: ${RESUME_OCR_TIMEOUT_SECONDS:30}
      ocr-language: ${RESUME_OCR_LANGUAGE:eng}
    clamav-host: ${CLAMAV_HOST:localhost}
    clamav-port: ${CLAMAV_PORT:3310}
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

# Opt-in only. UI is hosted centrally by api-gateway.
springdoc:
  api-docs:
    enabled: ${OPENHIRE_API_DOCS_ENABLED:false}
    path: /v3/api-docs
  paths-to-exclude: /api/v1/internal/**,/api/v1/jobs/internal/**,/actuator/**,/error
