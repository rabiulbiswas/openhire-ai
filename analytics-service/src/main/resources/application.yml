server:
  port: ${ANALYTICS_SERVICE_PORT:8096}
  shutdown: graceful

spring:
  application:
    name: analytics-service
  threads:
    virtual:
      enabled: true
  mongodb:
    representation:
      uuid: standard
    uri: ${MONGODB_URI:mongodb://localhost:27017/oh_analytics}
  data:
    mongodb:
      auto-index-creation: true
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        delivery.timeout.ms: 10000
        request.timeout.ms: 5000
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8180/realms/openhire-staff}
          jwk-set-uri: ${OIDC_JWK_SET_URI:http://localhost:8180/realms/openhire-staff/protocol/openid-connect/certs}

openhire:
  internal-secret: ${INTERNAL_SERVICE_SECRET:local-development-secret}
  application-url: ${APPLICATION_SERVICE_URL:http://localhost:8084}
  job-url: ${JOB_SERVICE_URL:http://localhost:8082}
  security:
    mode: ${SECURITY_MODE:oidc}
  tenant:
    default-id: ${DEFAULT_TENANT_ID:demo-org}
  analytics:
    poll-seconds: ${ANALYTICS_POLL_SECONDS:15}
    targets: ${ANALYTICS_TARGETS:identity-service=http://identity-service:8081,job-service=http://job-service:8082,approval-service=http://approval-service:8083,application-service=http://application-service:8084,candidate-service=http://candidate-service:8085,resume-processor=http://resume-processor:8086,interview-service=http://interview-service:8087,communication-service=http://communication-service:8088,notification-dispatcher=http://notification-dispatcher:8089,offer-service=http://offer-service:8090,employee-service=http://employee-service:8091,ai-gateway=http://ai-gateway:8092,ai-workers=http://ai-workers:8093,talent-service=http://talent-service:8094,compliance-service=http://compliance-service:8095,analytics-service=http://localhost:8096}
    public-api-service: ${ANALYTICS_PUBLIC_API_SERVICE:application-service}
    window-hours: 24
    lag-threshold: ${ANALYTICS_LAG_THRESHOLD:100}
    dlq-replay-per-minute: ${ANALYTICS_DLQ_REPLAY_PER_MINUTE:20}
    dlq-peek-limit: ${ANALYTICS_DLQ_PEEK_LIMIT:200}
    slo:
      availability-pct: 99.5
      latency-mean-ms: 500
      resume-pct: 95
      resume-seconds: 60
      ai-pct: 90
      ai-seconds: 120
      notification-pct: 99
      notification-seconds: 60
  # analytics-service publishes no domain events; the settings are required by shared wiring only.
  outbox:
    collection: analytics_events
    topic: analytics.events.v1
    relay-enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
