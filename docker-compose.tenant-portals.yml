# Local opt-in only; browsers reach apps through the loopback reverse proxy.
services:
  keycloak:
    ports: !override ["127.0.0.1:${KEYCLOAK_PORT:-8180}:8080"]
    environment:
      # LOCAL ONLY: Nginx registry-gates portal hosts and replaces all forwarded headers.
      KC_HOSTNAME: !reset null
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HTTP_MANAGEMENT_RELATIVE_PATH: /auth
      KC_HOSTNAME_ADMIN: !reset null
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "false"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /auth/health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '200 OK' <&3"]
    volumes:
      # Existing installations MUST run prepare-portal-keycloak.sh before recreation.
      - keycloak-h2-data:/opt/keycloak/data
  api-gateway:
    environment:
      OPENHIRE_PORTALS_ENABLED: "true"
      OPENHIRE_PORTALS_SAME_HOST_AUTH: "true"
      OPENHIRE_PORTALS_BASE_DOMAIN: localhost
      OPENHIRE_SECURITY_MODE: oidc
      SPRING_PROFILES_ACTIVE: oidc
      SECURITY_MODE: oidc
      STAFF_OIDC_ISSUER: http://admin.localhost/auth/realms/openhire-staff
      CANDIDATE_OIDC_ISSUER: http://admin.localhost/auth/realms/openhire-candidate
      STAFF_OIDC_INTERNAL_URL: http://keycloak:8080/auth
      CANDIDATE_OIDC_INTERNAL_URL: http://keycloak:8080/auth
      # Proxy supplies Host directly; never trust caller-provided Forwarded headers.
      SERVER_FORWARD_HEADERS_STRATEGY: none
      TENANT_OIDC_CLIENT_SECRET: ${TENANT_OIDC_CLIENT_SECRET:-local-tenant-client-change-me}
      PLATFORM_OIDC_CLIENT_SECRET: ${PLATFORM_OIDC_CLIENT_SECRET:-local-platform-client-change-me}
  identity-service:
    environment:
      OPENHIRE_PORTALS_SAME_HOST_AUTH: "true"
      OIDC_ISSUER_URI: http://admin.localhost/auth/realms/openhire-staff
      OIDC_JWK_SET_URI: http://keycloak:8080/auth/realms/openhire-staff/protocol/openid-connect/certs
      KEYCLOAK_BASE_URL: http://keycloak:8080/auth
      SECURITY_MODE: oidc
      IDENTITY_PROVIDER: keycloak
      OPENHIRE_PORTALS_ENABLED: "true"
      OPENHIRE_PORTALS_BASE_DOMAIN: localhost
      OPENHIRE_PORTALS_SCHEME: http
  job-service:
    environment: &portal-jwt
      OPENHIRE_PORTALS_SAME_HOST_AUTH: "true"
      OIDC_ISSUER_URI: http://admin.localhost/auth/realms/openhire-staff
      OIDC_JWK_SET_URI: http://keycloak:8080/auth/realms/openhire-staff/protocol/openid-connect/certs
      SECURITY_MODE: oidc
  approval-service:
    environment: *portal-jwt
  application-service:
    environment: *portal-jwt
  candidate-service:
    environment: *portal-jwt
  resume-processor:
    environment: *portal-jwt
  interview-service:
    environment: *portal-jwt
  communication-service:
    environment: *portal-jwt
  notification-dispatcher:
    environment: *portal-jwt
  offer-service:
    environment: *portal-jwt
  employee-service:
    environment: *portal-jwt
  ai-gateway:
    environment: *portal-jwt
  ai-workers:
    environment: *portal-jwt
  talent-service:
    environment: *portal-jwt
  compliance-service:
    environment: *portal-jwt
  analytics-service:
    environment: *portal-jwt
  integration-hub:
    environment: *portal-jwt
  tenant-proxy:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports: ["127.0.0.1:80:80"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes:
      - ./infra/tenant-portals/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    mem_limit: 64m
volumes:
  keycloak-h2-data:
