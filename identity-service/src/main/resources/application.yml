server:
  port: ${IDENTITY_PORT:8081}

spring:
  application:
    name: identity-service
  mongodb:
    representation:
      uuid: standard
    uri: ${MONGODB_URI:mongodb://localhost:27017/openhire_identity}
  data:
    mongodb:
      auto-index-creation: true
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8180/realms/openhire-staff}
          jwk-set-uri: ${OIDC_JWK_SET_URI:http://localhost:8180/realms/openhire-staff/protocol/openid-connect/certs}

openhire:
  internal:
    secret: ${INTERNAL_SERVICE_SECRET:local-development-secret}
  tenant:
    default-id: ${DEFAULT_TENANT_ID:}
  security:
    mode: ${SECURITY_MODE:local}
  identity:
    provider: ${IDENTITY_PROVIDER:local}
  bootstrap:
    sample-data:
      enabled: ${SAMPLE_DATA_ENABLED:false}
      organization-id: ${DEFAULT_TENANT_ID:}
      organization-name: ${SAMPLE_ORGANIZATION_NAME:Local workspace}
      organization-slug: ${SAMPLE_ORGANIZATION_SLUG:local-workspace}
      admin-email: ${SAMPLE_ADMIN_EMAIL:admin@openhire.local}
      recruiter-email: ${SAMPLE_RECRUITER_EMAIL:recruiter@openhire.local}
  events:
    publisher: ${EVENT_PUBLISHER:log}
  keycloak:
    base-url: ${KEYCLOAK_BASE_URL:http://localhost:8180}
    realm: ${KEYCLOAK_REALM:openhire-staff}
    admin-client-id: ${KEYCLOAK_ADMIN_CLIENT_ID:openhire-service}
    admin-client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET:change-me}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

# Opt-in only. UI is hosted centrally by api-gateway.
springdoc:
  api-docs:
    enabled: ${OPENHIRE_API_DOCS_ENABLED:false}
    path: /v3/api-docs
  paths-to-exclude: /api/v1/internal/**,/api/v1/jobs/internal/**,/actuator/**,/error
