server:
  port: ${APPROVAL_SERVICE_PORT:8083}
  shutdown: graceful

spring:
  application:
    name: approval-service
  threads:
    virtual:
      enabled: true
  mongodb:
    representation:
      uuid: standard
    uri: ${MONGODB_URI:mongodb://localhost:27017/oh_approval}
  data:
    mongodb:
      auto-index-creation: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8180/realms/openhire-staff}
          jwk-set-uri: ${OIDC_JWK_SET_URI:http://localhost:8180/realms/openhire-staff/protocol/openid-connect/certs}

openhire:
  tenant:
    default-id: ${DEFAULT_TENANT_ID:}
  events:
    publisher: ${EVENT_PUBLISHER:log}
  outbox:
    relay-enabled: ${OPENHIRE_OUTBOX_RELAY_ENABLED:false}
    poll-delay: 1000
  security:
    mode: ${SECURITY_MODE:local}
  job:
    base-url: ${JOB_SERVICE_URL:http://localhost:8082}
  internal-secret: ${INTERNAL_SERVICE_SECRET:local-development-secret}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
