global:
  scrape_interval: 60s
  scrape_timeout: 10s
  evaluation_interval: 60s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: openhire-slo
    metrics_path: /api/v1/internal/platform/metrics
    sample_limit: 1100
    label_limit: 8
    body_size_limit: 512KB
    http_headers:
      X-Internal-Service-Secret:
        files: [/etc/prometheus/internal-secret]
    static_configs:
      - targets: ['analytics-service:8096']
