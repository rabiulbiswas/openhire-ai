# Never log callback query parameters (authorization codes) or invitation tokens.
log_format portal_safe '$remote_addr $request_method $status';
map $http_upgrade $portal_connection { default upgrade; '' close; }
server { listen 80 default_server; server_name _; return 444; }
server {
    listen 80;
    server_name admin.localhost;
    access_log /var/log/nginx/access.log portal_safe;
    location ~ ^/(api|bff|oauth2|login)(/|$) {
        proxy_pass http://api-gateway:8080;
        proxy_set_header Host $host;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Proto "";
        proxy_buffering off;
    }
    location / {
        proxy_pass http://host.docker.internal:5175;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $portal_connection;
    }
}
server {
    listen 80;
    server_name ~^(?<tenant>[a-z0-9]+(?:-[a-z0-9]+)*)\.localhost$;
    access_log /var/log/nginx/access.log portal_safe;
    client_max_body_size 12m;
    location ~ ^/(api|bff|oauth2|login)(/|$) {
        proxy_pass http://api-gateway:8080;
        proxy_set_header Host $host;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Proto "";
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
    location /partner/ {
        proxy_pass http://host.docker.internal:5174;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $portal_connection;
    }
    location /candidate/ {
        proxy_pass http://host.docker.internal:3000;
        proxy_set_header Host $host;
    }
    location / {
        proxy_pass http://host.docker.internal:5173;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $portal_connection;
    }
}
