image:
  registry: openhire
  # Supply a tested immutable release tag; production admission should require image signatures/digests.
  tag: ""
  pullPolicy: IfNotPresent
replicas: 2
resources:
  requests: {cpu: 100m, memory: 256Mi}
  limits: {cpu: "1", memory: 768Mi}
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 4
  cpuPercent: 70
ingress:
  enabled: false
  className: nginx
  host: ""
  tlsSecret: ""
networkPolicy:
  enabled: true
  ingressNamespace: ingress-nginx
services:
  api-gateway: {enabled: true}
  identity-service: {enabled: true}
  job-service: {enabled: true}
  approval-service: {enabled: true}
  application-service: {enabled: true}
  candidate-service: {enabled: true}
  # Resume storage requires an existing PVC. Enable only after storage/scan dependencies are configured.
  resume-processor: {enabled: false, existingClaim: ""}
  interview-service: {enabled: true}
  communication-service: {enabled: true}
  notification-dispatcher: {enabled: true}
  offer-service: {enabled: true}
  employee-service: {enabled: true}
  ai-gateway: {enabled: true}
  ai-workers: {enabled: true}
  talent-service: {enabled: true}
  compliance-service: {enabled: true}
  analytics-service: {enabled: true}
  integration-hub: {enabled: true}
# Every enabled service requires an existing Secret named <release>-<service> containing
# its environment configuration. No development credentials are generated by this chart.
# Optional per-service: replicas, resources, autoscaling (boolean), env (list), volumes,
# volumeMounts. integration-hub secrets should be mounted read-only and referenced by
# INTEGRATION_SECRETS_DIRECTORY. All inter-service URLs use http://<release>-<service>:8080.
