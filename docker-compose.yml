name: openhire

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    ports:
      - "${KEYCLOAK_PORT:-8180}:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8180}
    volumes:
      - ./infra/keycloak/openhire-staff-realm.json:/opt/keycloak/data/import/openhire-staff-realm.json:ro
      - ./infra/keycloak/openhire-candidate-realm.json:/opt/keycloak/data/import/openhire-candidate-realm.json:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '200 OK' <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:4.0.0
    # Kafka's default heap grows to about 1 GB; a dev broker needs far less.
    mem_limit: 768m
    restart: unless-stopped
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: CONTROLLER://:9093,INTERNAL://:29092,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:${KAFKA_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      # CLI probes otherwise inherit the broker's 256–512 MB heap inside the
      # same 768 MB cgroup. Keep this JVM small without changing broker sizing.
      test: ["CMD-SHELL", "KAFKA_HEAP_OPTS='-Xms16m -Xmx64m' /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 20s

  identity-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: identity-service
    image: openhire/identity-service:local
    # Bounds memory so the stack fits Docker Desktop's default 8 GB; the JVM sizes its heap at 75% of this limit.
    mem_limit: 640m
    restart: unless-stopped
    ports:
      - "${IDENTITY_PORT:-8081}:8081"
    environment:
      OPENHIRE_API_DOCS_ENABLED: ${OPENHIRE_API_DOCS_ENABLED:-false}
      IDENTITY_PORT: 8081
      MAIL_HOST: ${MAIL_HOST:-mailpit}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_AUTH: ${MAIL_AUTH:-false}
      MAIL_STARTTLS: ${MAIL_STARTTLS:-false}
      MAIL_FROM: ${MAIL_FROM:-noreply@openhire.local}
      CANDIDATE_VERIFICATION_SECRET: ${CANDIDATE_VERIFICATION_SECRET:-${INTERNAL_SERVICE_SECRET:-local-development-secret}}
      # MongoDB runs on the host and can be inspected with MongoDB Compass.
      MONGODB_URI: ${MONGODB_URI:-mongodb://host.docker.internal:27017/openhire_identity}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      EVENT_PUBLISHER: kafka
      OPENHIRE_OUTBOX_RELAY_ENABLED: "true"
      SECURITY_MODE: ${SECURITY_MODE:-oidc}
      IDENTITY_PROVIDER: ${IDENTITY_PROVIDER:-keycloak}
      OIDC_ISSUER_URI: ${STAFF_OIDC_ISSUER:-http://localhost:8180/realms/openhire-staff}
      OIDC_JWK_SET_URI: ${OIDC_JWK_SET_URI:-http://keycloak:8080/realms/openhire-staff/protocol/openid-connect/certs}
      KEYCLOAK_BASE_URL: ${KEYCLOAK_BASE_URL:-http://keycloak:8080}
      KEYCLOAK_REALM: openhire-staff
      KEYCLOAK_ADMIN_CLIENT_ID: ${KEYCLOAK_ADMIN_CLIENT_ID:-openhire-service}
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET:-replace-before-use}
      DEFAULT_TENANT_ID: ${DEFAULT_TENANT_ID:-}
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:-local-development-secret}
      SAMPLE_DATA_ENABLED: ${SAMPLE_DATA_ENABLED:-false}
      SAMPLE_ADMIN_EMAIL: ${SAMPLE_ADMIN_EMAIL:-admin@openhire.local}
      SAMPLE_RECRUITER_EMAIL: ${SAMPLE_RECRUITER_EMAIL:-recruiter@openhire.local}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      keycloak:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  job-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: job-service
    image: openhire/job-service:local
    # Bounds memory so the stack fits Docker Desktop's default 8 GB; the JVM sizes its heap at 75% of this limit.
    mem_limit: 640m
    restart: unless-stopped
    ports:
      - "${JOB_SERVICE_PORT:-8082}:8082"
    environment:
      OPENHIRE_API_DOCS_ENABLED: ${OPENHIRE_API_DOCS_ENABLED:-false}
      JOB_SERVICE_PORT: 8082
      MONGODB_URI: ${JOB_MONGODB_URI:-mongodb://host.docker.internal:27017/oh_job}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      OPENHIRE_DEFAULT_TENANT: ${DEFAULT_TENANT_ID:-}
      OPENHIRE_OUTBOX_RELAY_ENABLED: "true"
      OPENHIRE_LLM_BASE_URL: ${OPENHIRE_LLM_BASE_URL:-http://host.docker.internal:11434}
      OPENHIRE_LLM_MODEL: ${OPENHIRE_LLM_MODEL:-qwen3:8b}
      OPENHIRE_LLM_API_STYLE: ${OPENHIRE_LLM_API_STYLE:-ollama}
      APPROVAL_SERVICE_URL: http://approval-service:8083
      APPLICATION_SERVICE_URL: http://application-service:8084
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:-local-development-secret}
      SECURITY_MODE: ${SECURITY_MODE:-oidc}
      OIDC_ISSUER_URI: ${STAFF_OIDC_ISSUER:-http://localhost:8180/realms/openhire-staff}
      OIDC_JWK_SET_URI: http://keycloak:8080/realms/openhire-staff/protocol/openid-connect/certs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      keycloak:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  approval-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: approval-service
    image: openhire/approval-service:local
    # Bounds memory so the stack fits Docker Desktop's default 8 GB; the JVM sizes its heap at 75% of this limit.
    mem_limit: 640m
    restart: unless-stopped
    ports:
      - "${APPROVAL_SERVICE_PORT:-8083}:8083"
    environment:
      OPENHIRE_API_DOCS_ENABLED: ${OPENHIRE_API_DOCS_ENABLED:-false}
      APPROVAL_SERVICE_PORT: 8083
      MONGODB_URI: ${APPROVAL_MONGODB_URI:-mongodb://host.docker.internal:27017/oh_approval}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      EVENT_PUBLISHER: kafka
      OPENHIRE_OUTBOX_RELAY_ENABLED: "true"
      DEFAULT_TENANT_ID: ${DEFAULT_TENANT_ID:-}
      JOB_SERVICE_URL: http://job-service:8082
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:-local-development-secret}
      SECURITY_MODE: ${SECURITY_MODE:-oidc}
      OIDC_ISSUER_URI: ${STAFF_OIDC_ISSUER:-http://localhost:8180/realms/openhire-staff}
      OIDC_JWK_SET_URI: http://keycloak:8080/realms/openhire-staff/protocol/openid-connect/certs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      keycloak:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8083/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  application-service:
    profiles: [phase3]
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: application-service
    image: openhire/application-service:local
    # Bounds memory so the stack fits Docker Desktop's default 8 GB; the JVM sizes its heap at 75% of this limit.
    mem_limit: 640m
    restart: unless-stopped
    ports:
      - "${APPLICATION_SERVICE_PORT:-8084}:8084"
    environment:
      OPENHIRE_API_DOCS_ENABLED: ${OPENHIRE_API_DOCS_ENABLED:-false}
      APPLICATION_SERVICE_PORT: 8084
      MONGODB_URI: ${APPLICATION_MONGODB_URI:-mongodb://host.docker.internal:27017/oh_application}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      OPENHIRE_OUTBOX_RELAY_ENABLED: "true"
      DEFAULT_TENANT_ID: ${DEFAULT_TENANT_ID:-}
      JOB_SERVICE_URL: http://job-service:8082
      CANDIDATE_SERVICE_URL: http://candidate-service:8085
      RESUME_PROCESSOR_URL: http://resume-processor:8086
      IDENTITY_SERVICE_URL: http://identity-service:8081
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:-local-development-secret}
      COMPLIANCE_SERVICE_URL: http://compliance-service:8095
      SECURITY_MODE: ${SECURITY_MODE:-oidc}
      OIDC_ISSUER_URI: ${STAFF_OIDC_ISSUER:-http://localhost:8180/realms/openhire-staff}
      OIDC_JWK_SET_URI: http://keycloak:8080/realms/openhire-staff/protocol/openid-connect/certs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      job-service:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8084/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  candidate-service:
    profiles: [phase3]
    build:
      context: .
      args:
        SERVICE: candidate-service
    image: openhire/candidate-service:local
    # Bounds memory so the stack fits Docker Desktop's default 8 GB; the JVM sizes its heap at 75% of this limit.
    mem_limit: 640m
    restart: unless-stopped
    ports: ["${CANDIDATE_SERVICE_PORT:-8085}:8085"]
    environment:
      OPENHIRE_API_DOCS_ENABLED: ${OPENHIRE_API_DOCS_ENABLED:-false}
      SERVICE_PORT: 8085
      APPLICATION_SERVICE_URL: http://application-service:8084
      MONGODB_URI: ${CANDIDATE_MONGODB_URI:-mongodb://host.docker.internal:27017/oh_candidate}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:-local-development-secret}
      DEFAULT_TENANT_ID: ${DEFAULT_TENANT_ID:-}
      SECURITY_MODE: ${SECURITY_MODE:-oidc}
      OIDC_ISSUER_URI: ${STAFF_OIDC_ISSUER:-http://localhost:8180/realms/openhire-staff}
      OIDC_JWK_SET_URI: http://keycloak:8080/realms/openhire-staff/protocol/openid-connect/certs
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      kafka:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8085/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  resume-processor:
    profiles: [phase3]
    build:
      context: .
      args:
        SERVICE: resume-processor
    image: openhire/resume-processor:local
    # Container ceiling only; reserve native OCR headroom with the 60% heap share below.
    mem_limit: 768m
    restart: unless-stopped
    ports: ["${RESUME_PROCESSOR_PORT:-8086}:8086"]
    environment:
      OPENHIRE_API_DOCS_ENABLED: ${OPENHIRE_API_DOCS_ENABLED:-false}
      SERVICE_PORT: 8086
      MONGODB_URI: ${RESUME_MONGODB_URI:-mongodb://host.docker.internal:27017/oh_resume}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:-local-development-secret}
      DEFAULT_TENANT_ID: ${DEFAULT_TENANT_ID:-}
      SECURITY_MODE: ${SECURITY_MODE:-oidc}
      OIDC_ISSUER_URI: ${STAFF_OIDC_ISSUER:-http://localhost:8180/realms/openhire-staff}
      OIDC_JWK_SET_URI: http://keycloak:8080/realms/openhire-staff/protocol/openid-connect/certs
      RESUME_DIRECTORY: /app/resumes
      # Native OCR shares this container; leave memory for Tesseract and PDF rendering.
      JVM_RAM_PERCENT: 60
      OMP_THREAD_LIMIT: 1
      RESUME_EXTRACTION_CONCURRENCY: ${RESUME_EXTRACTION_CONCURRENCY:-1}
      RESUME_EXTRACTION_TIMEOUT_SECONDS: ${RESUME_EXTRACTION_TIMEOUT_SECONDS:-80}
      RESUME_EXTRACTION_MAX_PAGES: ${RESUME_EXTRACTION_MAX_PAGES:-20}
      RESUME_EXTRACTION_MAX_CHARACTERS: ${RESUME_EXTRACTION_MAX_CHARACTERS:-1000000}
      RESUME_OCR_TIMEOUT_SECONDS: ${RESUME_OCR_TIMEOUT_SECONDS:-30}
      RESUME_OCR_LANGUAGE: ${RESUME_OCR_LANGUAGE:-eng}
      CLAMAV_HOST: clamav
      RESUME_SCAN_ENABLED: ${RESUME_SCAN_ENABLED:-true}
      CLAMAV_PORT: 3310
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes: ["resume-data:/app/resumes"]
    depends_on:
      kafka:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      clamav:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8086/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  clamav:
    profiles: [phase3]
    image: ${CLAMAV_IMAGE:-clamav/clamav:1.4}
    # Per-container ceiling, not a guarantee that the full stack fits host RAM.
    mem_limit: 1800m
    environment:
      # A signature reload otherwise keeps two databases in memory at once and gets the daemon OOM-killed.
      CLAMD_CONF_ConcurrentDatabaseReload: "no"
      # Local single-daemon mode; signature updates are a separate maintenance step.
      CLAMAV_NO_FRESHCLAMD: "true"
    # This upstream tag is amd64-only; Docker Desktop emulates it on Apple Silicon.
    platform: ${CLAMAV_PLATFORM:-linux/amd64}
    restart: unless-stopped
    # Upstream default /init leaves tail alive when clamd is killed. Foreground
    # mode propagates daemon exit to Docker's restart policy instead.
    entrypoint: ["/bin/sh", "/etc/openhire/start-clamav.sh"]
    volumes:
      - clamav-data:/var/lib/clamav
      - ./infra/clamav/start-local.sh:/etc/openhire/start-clamav.sh:ro
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s

  interview-service:
    profiles: [phase4]
    # Bounds the JVM: the image sizes its heap at 75% of the container limit.
    mem_limit: 640m
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: interview-service
    image: openhire/interview-service:local
    restart: unless-stopped
    ports:
      - "${INTERVIEW_SERVICE_PORT:-8087}:8087"
    environment:
      OPENHIRE_API_DOCS_ENABLED: ${OPENHIRE_API_DOCS_ENABLED:-false}
      INTERVIEW_SERVICE_PORT: 8087
      MONGODB_URI: ${INTERVIEW_MONGODB_URI:-mongodb://host.docker.internal:27017/oh_interview}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      OPENHIRE_OUTBOX_RELAY_ENABLED: "true"
      DEFAULT_TENANT_ID: ${DEFAULT_TENANT_ID:-}
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:-local-development-secret}
      SECURITY_MODE: ${SECURITY_MODE:-oidc}
      OIDC_ISSUER_URI: ${STAFF_OIDC_ISSUER:-http://localhost:8180/realms/openhire-staff}
      OIDC_JWK_SET_URI: http://keycloak:8080/realms/openhire-staff/protocol/openid-connect/certs
      APPLICATION_SERVICE_URL: http://application-service:8084
      JOB_SERVICE_URL: http://job-service:8082
      CANDIDATE_PORTAL_URL: ${CANDIDATE_PORTAL_URL:-http://localhost:3000}
      SCHEDULING_TOKEN_SECRET: ${SCHEDULING_TOKEN_SECRET:-local-development-scheduling-secret}
      INTERVIEW_DEFAULT_TIMEZONE: ${INTERVIEW_DEFAULT_TIMEZONE:-Asia/Kolkata}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      keycloak:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      application-service:
        condition: service_healthy
      job-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8087/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  offer-service:
    profiles: [phase5]
    # Bounds the JVM: the image sizes its heap at 75% of the container limit.
    mem_limit: 640m
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: offer-service
    image: openhire/offer-service:local
    restart: unless-stopped
    ports:
      # Host side only; containers use offer-service:8090. 8090 is commonly taken by other local tools.
      - "${OFFER_SERVICE_HOST_PORT:-8095}:8090"
    environment:
      OPENHIRE_API_DOCS_ENABLED: ${OPENHIRE_API_DOCS_ENABLED:-false}
      OFFER_SERVICE_PORT: 8090
      MONGODB_URI: ${OFFER_MONGODB_URI:-mongodb://host.docker.internal:27017/oh_offer}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      OPENHIRE_OUTBOX_RELAY_ENABLED: "true"
      DEFAULT_TENANT_ID: ${DEFAULT_TENANT_ID:-}
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:-local-development-secret}
      SECURITY_MODE: ${SECURITY_MODE:-oidc}
      OIDC_ISSUER_URI: ${STAFF_OIDC_ISSUER:-http://localhost:8180/realms/openhire-staff}
      OIDC_JWK_SET_URI: http://keycloak:8080/realms/openhire-staff/protocol/openid-connect/certs
      APPLICATION_SERVICE_URL: http://application-service:8084
      JOB_SERVICE_URL: http://job-service:8082
      CANDIDATE_PORTAL_URL: ${CANDIDATE_PORTAL_URL:-http://localhost:3000}
      OFFER_TOKEN_SECRET: ${OFFER_TOKEN_SECRET:-local-development-offer-secret}
      COMPANY_NAME: ${COMPANY_NAME:-Northwind Payments}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      keycloak:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      application-service:
        condition: service_healthy
      job-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8090/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  employee-service:
    profiles: [phase5]
    # Bounds the JVM: the image sizes its heap at 75% of the container limit.
    mem_limit: 640m
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: employee-service
    image: openhire/employee-service:local
    restart: unless-stopped
    ports:
      # Host side only; containers use employee-service:8091.
      - "${EMPLOYEE_SERVICE_HOST_PORT:-8096}:8091"
    environment:
      OPENHIRE_API_DOCS_ENABLED: ${OPENHIRE_API_DOCS_ENABLED:-false}
      EMPLOYEE_SERVICE_PORT: 8091
      MONGODB_URI: ${EMPLOYEE_MONGODB_URI:-mongodb://host.docker.internal:27017/oh_employee}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      OPENHIRE_OUTBOX_RELAY_ENABLED: "true"
      DEFAULT_TENANT_ID: ${DEFAULT_TENANT_ID:-}
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:-local-development-secret}
      SECURITY_MODE: ${SECURITY_MODE:-oidc}
      OIDC_ISSUER_URI: ${STAFF_OIDC_ISSUER:-http://localhost:8180/realms/openhire-staff}
      OIDC_JWK_SET_URI: http://keycloak:8080/realms/openhire-staff/protocol/openid-connect/certs
      APPLICATION_SERVICE_URL: http://application-service:8084
      JOB_SERVICE_URL: http://job-service:8082
      OFFER_SERVICE_URL: http://offer-service:8090
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      keycloak:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      application-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8091/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  ai-gateway:
    profiles: [phase6]
    # Bounds the JVM: the image sizes its heap at 75% of the container limit.
    mem_limit: 512m
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: ai-gateway
    image: openhire/ai-gateway:local
    restart: unless-stopped
    ports:
      # Host side only; containers use ai-gateway:8092.
      - "${AI_GATEWAY_HOST_PORT:-8097}:8092"
    environment:
      OPENHIRE_API_DOCS_ENABLED: ${OPENHIRE_API_DOCS_ENABLED:-false}
      AI_GATEWAY_PORT: 8092
