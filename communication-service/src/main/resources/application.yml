server:
  port: ${COMMUNICATION_SERVICE_PORT:8088}
  shutdown: graceful

spring:
  application:
    name: communication-service
  threads:
    virtual:
      enabled: true
  mongodb:
    representation:
      uuid: standard
    uri: ${MONGODB_URI:mongodb://localhost:27017/oh_comm}
  data:
    mongodb:
      auto-index-creation: true
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        delivery.timeout.ms: 10000
        request.timeout.ms: 5000
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8180/realms/openhire-staff}
          jwk-set-uri: ${OIDC_JWK_SET_URI:http://localhost:8180/realms/openhire-staff/protocol/openid-connect/certs}

openhire:
  internal-secret: ${INTERNAL_SERVICE_SECRET:local-development-secret}
  application-url: ${APPLICATION_SERVICE_URL:http://localhost:8084}
  ai:
    gateway-url: ${AI_GATEWAY_URL:http://localhost:8092}
  security:
    mode: ${SECURITY_MODE:oidc}
  tenant:
    default-id: ${DEFAULT_TENANT_ID:demo-org}
  communication:
    company-name: ${COMPANY_NAME:Northwind Payments}
    default-timezone: ${COMMUNICATION_DEFAULT_TIMEZONE:Asia/Kolkata}
    digest-delay: ${COMMUNICATION_DIGEST_DELAY_MS:300000}
  outbox:
    collection: messages
    topic: communication.commands.v1
    relay-enabled: ${OPENHIRE_OUTBOX_RELAY_ENABLED:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
