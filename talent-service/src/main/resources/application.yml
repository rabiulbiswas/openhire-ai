server:
  port: ${TALENT_SERVICE_PORT:8094}
  shutdown: graceful

spring:
  application:
    name: talent-service
  threads:
    virtual:
      enabled: true
  mongodb:
    representation:
      uuid: standard
    uri: ${MONGODB_URI:mongodb://localhost:27017/oh_talent}
  data:
    mongodb:
      auto-index-creation: true
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        delivery.timeout.ms: 10000
        request.timeout.ms: 5000
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8180/realms/openhire-staff}
          jwk-set-uri: ${OIDC_JWK_SET_URI:http://localhost:8180/realms/openhire-staff/protocol/openid-connect/certs}

openhire:
  internal-secret: ${INTERNAL_SERVICE_SECRET:local-development-secret}
  application-url: ${APPLICATION_SERVICE_URL:http://localhost:8084}
  job-url: ${JOB_SERVICE_URL:http://localhost:8082}
  security:
    mode: ${SECURITY_MODE:oidc}
  tenant:
    default-id: ${DEFAULT_TENANT_ID:demo-org}
  talent:
    gateway-url: ${AI_GATEWAY_URL:http://localhost:8092}
    resume-url: ${RESUME_PROCESSOR_URL:http://localhost:8086}
    communication-url: ${COMMUNICATION_SERVICE_URL:http://localhost:8088}
    retention-months: ${TALENT_RETENTION_MONTHS:24}
    rediscovery-top: ${TALENT_REDISCOVERY_TOP:500}
    explain-top: ${TALENT_EXPLAIN_TOP:10}
    cooldown-days: ${TALENT_COOLDOWN_DAYS:30}
    result-limit: ${TALENT_RESULT_LIMIT:50}
    internal-mobility: ${TALENT_INTERNAL_MOBILITY:false}
    expiry-warning-days: ${TALENT_EXPIRY_WARNING_DAYS:60}
    run-cache-minutes: ${TALENT_RUN_CACHE_MINUTES:10}
    gateway-timeout-ms: ${TALENT_GATEWAY_TIMEOUT_MS:30000}
    sweep-cron: ${TALENT_SWEEP_CRON:0 30 2 * * *}
  outbox:
    collection: talent_events
    topic: talent.events.v1
    relay-enabled: ${OPENHIRE_OUTBOX_RELAY_ENABLED:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
