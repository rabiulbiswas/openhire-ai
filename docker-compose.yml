  # Optional low-memory monitoring. No dependency on the full stack or the resume scanner.
  prometheus:
    profiles: [monitoring]
    image: prom/prometheus:v3.5.0
    mem_limit: 192m
    cpus: 0.5
    environment:
      GOMEMLIMIT: 128MiB
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=24h
      - --storage.tsdb.retention.size=128MB
      - --query.max-concurrency=2
      - --query.max-samples=100000
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      # Supply a file containing INTERNAL_SERVICE_SECRET if overriding the local development default.
      - ${PROMETHEUS_SECRET_FILE:-./infra/prometheus/internal-secret.local}:/etc/prometheus/internal-secret:ro
      - prometheus-data:/prometheus
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9090/-/ready"]
      interval: 30s
      timeout: 5s
      retries: 3

