# Never log callback query parameters (authorization codes) or invitation tokens.
log_format portal_safe '$remote_addr $request_method $status';
map $http_upgrade $portal_connection { default upgrade; '' ''; }
# Docker Desktop advertises an IPv6 host address even on IPv4-only networks.
# Refresh host addresses without a proxy restart; never try unreachable IPv6.
resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 5s;
# Application containers can receive a different IP after every deployment.
# Resolve them at runtime just like the host frontends, not only at nginx startup.
upstream portal_gateway {
    zone portal_gateway 64k;
    server api-gateway:8080 resolve;
}
upstream portal_identity {
    zone portal_identity 64k;
    server keycloak:8080 resolve;
}
upstream console_frontend {
    zone console_frontend 64k;
    server host.docker.internal:5173 resolve;
    keepalive 16;
}
upstream platform_frontend {
    zone platform_frontend 64k;
    server host.docker.internal:5175 resolve;
    keepalive 16;
}
upstream partner_frontend {
    zone partner_frontend 64k;
    server host.docker.internal:5174 resolve;
    keepalive 16;
}
upstream candidate_frontend {
    zone candidate_frontend 64k;
    server host.docker.internal:3000 resolve;
    keepalive 16;
}
proxy_connect_timeout 5s;
server { listen 80 default_server; server_name _; return 444; }
server {
    listen 80;
    server_name auth.localhost;
    access_log /var/log/nginx/access.log portal_safe;
    client_max_body_size 1m;
    # Old shared authentication host is deliberately retired.
    location / { return 404; }
}
server {
    listen 80;
    server_name admin.localhost;

    location = /_portal_check {
        internal;
        proxy_pass http://portal_gateway/bff/portal-status;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Proto "";
    }
    location ~ ^/auth/(realms/openhire-staff|resources)(/|$) {
        # Explicit gateway endpoint independently checks the active tenant registry before access.
        auth_request /_portal_check;
        proxy_pass http://portal_identity;
        proxy_set_header Host $host;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header X-Forwarded-Port 80;
        proxy_set_header X-Forwarded-Prefix "";
        proxy_set_header X-Forwarded-Ssl "";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_redirect off;
        proxy_read_timeout 90s;
        client_max_body_size 1m;
    }
    location /auth/ { return 404; }
    access_log /var/log/nginx/access.log portal_safe;
    location ~ ^/(api|bff|oauth2|login)(/|$) {
        proxy_pass http://portal_gateway;
        proxy_set_header Host $host;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Proto "";
        proxy_buffering off;
    }
    location / {
        proxy_pass http://platform_frontend;
        proxy_connect_timeout 15s;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $portal_connection;
    }
}
server {
    listen 80;
    server_name ~^(?<tenant>[a-z0-9]+(?:-[a-z0-9]+)*)\.localhost$;

    location = /_portal_check {
        internal;
        proxy_pass http://portal_gateway/bff/portal-status;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Proto "";
    }
    location ~ ^/auth/(realms/openhire-staff|resources)(/|$) {
        # Explicit gateway endpoint independently checks the active tenant registry before access.
        auth_request /_portal_check;
        proxy_pass http://portal_identity;
        proxy_set_header Host $host;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header X-Forwarded-Port 80;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Prefix "";
        proxy_set_header X-Forwarded-Ssl "";
        proxy_redirect off;
        proxy_read_timeout 90s;
        client_max_body_size 1m;
    }
    location /auth/ { return 404; }
    access_log /var/log/nginx/access.log portal_safe;
    client_max_body_size 12m;
    location ~ ^/(api|bff|oauth2|login)(/|$) {
        proxy_pass http://portal_gateway;
        proxy_set_header Host $host;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Proto "";
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
    location /partner/ {
        proxy_pass http://partner_frontend;
        proxy_connect_timeout 15s;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $portal_connection;
    }
    location /candidate/ {
        proxy_pass http://candidate_frontend;
        proxy_connect_timeout 15s;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
    location / {
        proxy_pass http://console_frontend;
        proxy_connect_timeout 15s;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $portal_connection;
    }
}
